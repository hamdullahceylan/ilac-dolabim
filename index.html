<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e1b4b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="İlaç Dolabım" />
  <title>İlaç Dolabım</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; background: #0f0f1a; }
    ::-webkit-scrollbar { display: none; }
    input, select, textarea, button { font-family: 'Nunito', sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes scanLine { 0%{top:10%} 50%{top:85%} 100%{top:10%} }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

  <script>
    window.storage = {
      get: async (key) => { const v = localStorage.getItem(key); return v ? { value: v } : null; },
      set: async (key, value) => { localStorage.setItem(key, value); return { key, value }; },
      delete: async (key) => { localStorage.removeItem(key); return { key, deleted: true }; }
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const CATEGORIES = [
      { id: "all",         label: "Tümü",           icon: "💊", color: "#6366f1" },
      { id: "agri-ates",   label: "Ağrı & Ateş",    icon: "🌡️", color: "#ef4444" },
      { id: "antibiyotik", label: "Antibiyotik",     icon: "🦠", color: "#f59e0b" },
      { id: "vitamin",     label: "Vitamin",          icon: "✨", color: "#10b981" },
      { id: "kalp",        label: "Kalp & Tansiyon", icon: "❤️", color: "#ec4899" },
      { id: "sindirim",    label: "Sindirim",         icon: "🫃", color: "#8b5cf6" },
      { id: "allerji",     label: "Alerji",           icon: "🌸", color: "#06b6d4" },
      { id: "diger",       label: "Diğer",            icon: "📦", color: "#64748b" },
    ];

    const STORAGE_KEY = "medicine-cabinet-v3";

    function getDaysUntilExpiry(dateStr) {
      if (!dateStr) return null;
      return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
    }

    function parseGS1(raw) {
      const result = {};
      const aiMap = { "01": "gtin", "17": "expiry", "21": "serial", "10": "batch" };
      const paren = /\((\d{2})\)([^(]+)/g;
      let m;
      while ((m = paren.exec(raw)) !== null) {
        const key = aiMap[m[1]];
        if (key) result[key] = m[2].trim();
      }
      if (!result.gtin) {
        const re = /01(\d{14})17(\d{6})(?:21([^\x1d\n]*))?(?:10([^\x1d\n]*))?/;
        const m2 = re.exec(raw.replace(/\u001d/g, ""));
        if (m2) { result.gtin = m2[1]; result.expiry = m2[2]; if (m2[3]) result.serial = m2[3]; }
      }
      if (!result.gtin) return null;
      if (result.expiry) {
        const e = result.expiry;
        const yy = parseInt(e.slice(0,2));
        const yyyy = yy < 50 ? 2000+yy : 1900+yy;
        const mm = e.slice(2,4);
        const dd = e.slice(4,6)==="00"?"01":e.slice(4,6);
        result.expiryDate = `${yyyy}-${mm}-${dd}`;
      }
      return result;
    }

    // ── Camera QR Scanner ──
    function CameraScanner({ onResult, onClose }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const rafRef = useRef(null);
      const [status, setStatus] = useState("Kamera başlatılıyor…");
      const [error, setError] = useState(null);

      useEffect(() => {
        let active = true;
        navigator.mediaDevices?.getUserMedia({ video: { facingMode: "environment" }, audio: false })
          .then(stream => {
            if (!active) { stream.getTracks().forEach(t => t.stop()); return; }
            streamRef.current = stream;
            if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); setStatus("Karekodu kameraya gösterin"); }
          })
          .catch(e => setError("Kamera erişimi sağlanamadı: " + e.message));
        return () => { active = false; streamRef.current?.getTracks().forEach(t => t.stop()); cancelAnimationFrame(rafRef.current); };
      }, []);

      useEffect(() => {
        if (!window.jsQR) return;
        const scan = () => {
          const video = videoRef.current, canvas = canvasRef.current;
          if (video && canvas && video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);
            const id = canvas.getContext("2d").getImageData(0,0,canvas.width,canvas.height);
            const code = window.jsQR(id.data, id.width, id.height, { inversionAttempts: "dontInvert" });
            if (code) { onResult(code.data); return; }
          }
          rafRef.current = requestAnimationFrame(scan);
        };
        rafRef.current = requestAnimationFrame(scan);
        return () => cancelAnimationFrame(rafRef.current);
      }, [onResult]);

      return (
        <div style={S.scannerWrap}>
          <div style={S.scannerHeader}>
            <span style={{fontWeight:800,fontSize:17}}>📷 Karekod Tara</span>
            <button style={S.closeBtn2} onClick={onClose}>✕</button>
          </div>
          {error ? (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,padding:40}}>
              <div style={{fontSize:48}}>📵</div>
              <div style={{textAlign:"center",color:"#94a3b8",fontSize:14}}>{error}</div>
            </div>
          ) : (
            <>
              <div style={{position:"relative",width:"100%",aspectRatio:"1",overflow:"hidden",background:"#000"}}>
                <video ref={videoRef} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}} playsInline muted />
                <canvas ref={canvasRef} style={{display:"none"}} />
                <div style={{position:"absolute",top:"15%",left:"15%",width:32,height:32,borderTop:"3px solid #6366f1",borderLeft:"3px solid #6366f1",borderRadius:"6px 0 0 0"}}/>
                <div style={{position:"absolute",top:"15%",right:"15%",width:32,height:32,borderTop:"3px solid #6366f1",borderRight:"3px solid #6366f1",borderRadius:"0 6px 0 0"}}/>
                <div style={{position:"absolute",bottom:"15%",left:"15%",width:32,height:32,borderBottom:"3px solid #6366f1",borderLeft:"3px solid #6366f1",borderRadius:"0 0 0 6px"}}/>
                <div style={{position:"absolute",bottom:"15%",right:"15%",width:32,height:32,borderBottom:"3px solid #6366f1",borderRight:"3px solid #6366f1",borderRadius:"0 0 6px 0"}}/>
                <div style={{position:"absolute",left:"15%",right:"15%",height:2,background:"linear-gradient(90deg,transparent,#6366f1,transparent)",animation:"scanLine 2s ease-in-out infinite"}}/>
              </div>
              <div style={{padding:"12px 16px 4px",textAlign:"center",fontWeight:700,fontSize:15,color:"#a5b4fc"}}>{status}</div>
              <div style={{padding:"4px 16px 16px",textAlign:"center",fontSize:12,color:"#64748b"}}>İlaç kutusundaki <strong>DataMatrix / QR</strong> karekoduna doğrultun</div>
            </>
          )}
        </div>
      );
    }

    // ── Add Method ──
    function AddMethodModal({ onQR, onManual, onClose }) {
      return (
        <div style={S.overlay} onClick={onClose}>
          <div style={{...S.modal,animation:"slideUp .25s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={S.modalHeader}>
              <span style={S.modalTitle}>İlaç Ekle</span>
              <button style={S.closeBtn} onClick={onClose}>✕</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <button onClick={onQR} style={{display:"flex",alignItems:"center",gap:14,background:"rgba(99,102,241,.08)",border:"1px solid rgba(99,102,241,.3)",borderRadius:14,padding:"14px 16px",cursor:"pointer",textAlign:"left",width:"100%"}}>
                <span style={{fontSize:32}}>📷</span>
                <div>
                  <div style={{color:"#f1f5f9",fontWeight:700,fontSize:15,fontFamily:"Nunito"}}>Karekod Tara</div>
                  <div style={{color:"#64748b",fontSize:12,marginTop:3,fontFamily:"Nunito"}}>İlaç kutusundaki DataMatrix / QR kodu okut</div>
                </div>
              </button>
              <button onClick={onManual} style={{display:"flex",alignItems:"center",gap:14,background:"rgba(71,85,105,.08)",border:"1px solid rgba(71,85,105,.3)",borderRadius:14,padding:"14px 16px",cursor:"pointer",textAlign:"left",width:"100%"}}>
                <span style={{fontSize:32}}>✏️</span>
                <div>
                  <div style={{color:"#f1f5f9",fontWeight:700,fontSize:15,fontFamily:"Nunito"}}>Manuel Gir</div>
                  <div style={{color:"#64748b",fontSize:12,marginTop:3,fontFamily:"Nunito"}}>Bilgileri kendiniz doldurun</div>
                </div>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── QR Result ──
    function QRResultModal({ gs1, onConfirm, onClose }) {
      return (
        <Modal title="✅ Karekod Okundu" onClose={onClose}>
          <div style={{background:"#0f0f1a",borderRadius:10,padding:"10px 14px",fontSize:13,color:"#94a3b8",marginBottom:16,lineHeight:2}}>
            <div><span style={{color:"#6366f1",fontWeight:700}}>GTIN: </span>{gs1.gtin}</div>
            {gs1.expiryDate && <div><span style={{color:"#6366f1",fontWeight:700}}>SKT: </span>{gs1.expiryDate}</div>}
            {gs1.serial && <div><span style={{color:"#6366f1",fontWeight:700}}>Seri: </span>{gs1.serial}</div>}
          </div>
          <MedicineForm
            initial={{name:"",category:"diger",stock:"1",expiryDate:gs1.expiryDate||"",description:""}}
            onSave={onConfirm}
            onClose={onClose}
          />
        </Modal>
      );
    }

    // ── Modal ──
    function Modal({ title, onClose, children }) {
      return (
        <div style={S.overlay} onClick={onClose}>
          <div style={{...S.modal,animation:"slideUp .25s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={S.modalHeader}>
              <span style={S.modalTitle}>{title}</span>
              <button style={S.closeBtn} onClick={onClose}>✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // ── Medicine Form ──
    function MedicineForm({ initial, onSave, onClose }) {
      const [form, setForm] = useState(initial || {name:"",category:"diger",stock:"",expiryDate:"",description:""});
      const set = (k,v) => setForm(f=>({...f,[k]:v}));
      return (
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div>
            <label style={S.label}>İlaç Adı *</label>
            <input style={S.input} value={form.name} onChange={e=>set("name",e.target.value)} placeholder="Örn: Parol 500mg Tablet"/>
          </div>
          <div>
            <label style={S.label}>Kategori</label>
            <select style={S.input} value={form.category} onChange={e=>set("category",e.target.value)}>
              {CATEGORIES.filter(c=>c.id!=="all").map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
            </select>
          </div>
          <div>
            <label style={S.label}>Stok (adet)</label>
            <input style={S.input} type="number" min="0" value={form.stock} onChange={e=>set("stock",e.target.value)} placeholder="0"/>
          </div>
          <div>
            <label style={S.label}>Son Kullanma Tarihi</label>
            <input style={S.input} type="date" value={form.expiryDate} onChange={e=>set("expiryDate",e.target.value)}/>
          </div>
          <div>
            <label style={S.label}>Not / Açıklama</label>
            <textarea style={{...S.input,height:70,resize:"vertical"}} value={form.description} onChange={e=>set("description",e.target.value)} placeholder="İsteğe bağlı…"/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button style={{...S.cancelBtn,flex:1}} onClick={onClose}>İptal</button>
            <button style={{...S.primaryBtn,flex:1}} onClick={()=>form.name.trim()&&onSave(form)}>
              {initial?.name ? "Güncelle" : "Kaydet"}
            </button>
          </div>
        </div>
      );
    }

    // ── Expiry Badge ──
    function ExpiryBadge({ days }) {
      if (days===null) return null;
      if (days<0)   return <span style={S.badge.expired}>Süresi Dolmuş</span>;
      if (days<=30) return <span style={S.badge.soon}>{days} gün kaldı</span>;
      if (days<=90) return <span style={S.badge.warn}>{days} gün kaldı</span>;
      return null;
    }

    // ── Medicine Card ──
    function MedicineCard({ med, onEdit, onDelete }) {
      const days = getDaysUntilExpiry(med.expiryDate);
      const cat = CATEGORIES.find(c=>c.id===med.category)||CATEGORIES[7];
      const isExpired = days !== null && days < 0;

      return (
        <div style={{...S.card, borderLeft:`4px solid ${cat.color}`, opacity: isExpired ? 0.65 : 1}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <span style={{fontSize:26}}>{cat.icon}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:16,fontWeight:700,color:"#f1f5f9"}}>{med.name}</div>
              <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{cat.label}</div>
            </div>
            <div style={{display:"flex",gap:2}}>
              <button style={S.iconBtn} onClick={()=>onEdit(med)}>✏️</button>
              <button style={S.iconBtn} onClick={()=>onDelete(med.id)}>🗑️</button>
            </div>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8,alignItems:"center"}}>
            {med.stock!==undefined && <span style={S.chip}>📦 {med.stock} adet</span>}
            {med.expiryDate && <span style={S.chip}>📅 {med.expiryDate}</span>}
            <ExpiryBadge days={days}/>
          </div>
          {med.description && <div style={{fontSize:13,color:"#64748b",marginBottom:10,lineHeight:1.6}}>{med.description}</div>}
          <button
            style={S.googleBtn}
            onClick={()=>window.open(`https://www.google.com/search?q=${encodeURIComponent(med.name + " ilacı ne işe yarar")}`, "_blank")}
          >
            🔍 Google'da Ara
          </button>
        </div>
      );
    }

    // ── Main App ──
    function App() {
      const [meds, setMeds] = useState([]);
      const [filter, setFilter] = useState("all");
      const [search, setSearch] = useState("");
      const [sortBy, setSortBy] = useState("name");
      const [mode, setMode] = useState(null);
      const [editMed, setEditMed] = useState(null);
      const [qrGs1, setQrGs1] = useState(null);
      const [prefilledForm, setPrefilledForm] = useState(null);

      useEffect(()=>{
        (async()=>{ try { const r=await window.storage.get(STORAGE_KEY); if(r?.value) setMeds(JSON.parse(r.value)); } catch{} })();
      },[]);

      const persist = useCallback(async(data)=>{ try { await window.storage.set(STORAGE_KEY,JSON.stringify(data)); } catch{} },[]);

      const addMed = (form) => {
        const m={...form,id:Date.now().toString(),stock:Number(form.stock)||0};
        const u=[...meds,m]; setMeds(u); persist(u); closeAll();
      };
      const updateMed = (form) => {
        const u=meds.map(m=>m.id===editMed.id?{...editMed,...form,stock:Number(form.stock)||0}:m);
        setMeds(u); persist(u); closeAll();
      };
      const deleteMed = (id) => {
        if(!confirm("Bu ilacı silmek istiyor musunuz?")) return;
        const u=meds.filter(m=>m.id!==id); setMeds(u); persist(u);
      };
      const closeAll = () => { setMode(null); setEditMed(null); setQrGs1(null); setPrefilledForm(null); };

      const handleQR = useCallback((raw) => {
        const gs1 = parseGS1(raw);
        if (gs1) { setQrGs1(gs1); setMode("qrResult"); }
        else { setPrefilledForm({name:raw.slice(0,80),category:"diger",stock:"1",expiryDate:"",description:""}); setMode("form"); }
      },[]);

      const filtered = meds
        .filter(m=>filter==="all"||m.category===filter)
        .filter(m=>m.name.toLowerCase().includes(search.toLowerCase()))
        .sort((a,b)=>{
          if(sortBy==="name") return a.name.localeCompare(b.name,"tr");
          if(sortBy==="expiry") return (getDaysUntilExpiry(a.expiryDate)??9999)-(getDaysUntilExpiry(b.expiryDate)??9999);
          if(sortBy==="stock") return (a.stock||0)-(b.stock||0);
          return 0;
        });

      const expiringSoon = meds.filter(m=>{ const d=getDaysUntilExpiry(m.expiryDate); return d!==null&&d<=30; });

      return (
        <div style={S.app}>
          {/* Header */}
          <div style={S.header}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
              <div>
                <div style={{fontSize:24,fontWeight:800}}>💊 İlaç Dolabım</div>
                <div style={{fontSize:12,color:"#a5b4fc",marginTop:2}}>{meds.length} ilaç kayıtlı</div>
              </div>
              <button style={S.addBtn} onClick={()=>setMode("choose")}>+ Ekle</button>
            </div>

            {expiringSoon.length>0 && (
              <div style={{background:"rgba(239,68,68,.15)",border:"1px solid rgba(239,68,68,.3)",borderRadius:10,padding:"8px 12px",fontSize:13,color:"#fca5a5",marginBottom:10}}>
                ⚠️ {expiringSoon.length} ilacın son kullanma tarihi yaklaşıyor veya dolmuş!
              </div>
            )}

            <input style={S.search} placeholder="🔍 İlaç ara…" value={search} onChange={e=>setSearch(e.target.value)}/>

            <div style={{display:"flex",alignItems:"center",gap:6,paddingBottom:14}}>
              <span style={{fontSize:12,color:"#a5b4fc"}}>Sırala:</span>
              {[["name","İsim"],["expiry","SKT"],["stock","Stok"]].map(([v,l])=>(
                <button key={v}
                  style={{background:sortBy===v?"#6366f1":"rgba(255,255,255,.08)",border:"none",color:sortBy===v?"#fff":"#c7d2fe",borderRadius:8,padding:"4px 10px",fontSize:12,cursor:"pointer"}}
                  onClick={()=>setSortBy(v)}>{l}
                </button>
              ))}
            </div>
          </div>

          {/* Kategori sekmeleri */}
          <div style={{display:"flex",gap:8,overflowX:"auto",padding:"12px 16px",scrollbarWidth:"none"}}>
            {CATEGORIES.map(c=>{
              const count=c.id==="all"?meds.length:meds.filter(m=>m.category===c.id).length;
              return (
                <button key={c.id}
                  style={{whiteSpace:"nowrap",background:filter===c.id?c.color:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",color:filter===c.id?"#fff":"#c7d2fe",borderRadius:20,padding:"6px 14px",fontSize:13,cursor:"pointer"}}
                  onClick={()=>setFilter(c.id)}>
                  {c.icon} {c.label}{count>0?` ${count}`:""}
                </button>
              );
            })}
          </div>

          {/* Liste */}
          <div style={{padding:"12px 16px",display:"flex",flexDirection:"column",gap:12}}>
            {filtered.length===0
              ? <div style={{textAlign:"center",color:"#64748b",padding:60,fontSize:16}}>
                  {meds.length===0?"İlk ilacınızı ekleyin! 💊":"Sonuç bulunamadı."}
                </div>
              : filtered.map(m=><MedicineCard key={m.id} med={m} onEdit={med=>{setEditMed(med);setMode("edit");}} onDelete={deleteMed}/>)
            }
          </div>

          {/* Modaller */}
          {mode==="choose" && <AddMethodModal onQR={()=>setMode("qr")} onManual={()=>{setPrefilledForm(null);setMode("form");}} onClose={closeAll}/>}

          {mode==="qr" && (
            <div style={S.overlay}>
              <CameraScanner onResult={handleQR} onClose={()=>setMode("choose")}/>
            </div>
          )}

          {mode==="form" && (
            <Modal title="Yeni İlaç Ekle" onClose={closeAll}>
              <MedicineForm initial={prefilledForm} onSave={addMed} onClose={closeAll}/>
            </Modal>
          )}

          {mode==="edit" && editMed && (
            <Modal title="İlacı Düzenle" onClose={closeAll}>
              <MedicineForm initial={editMed} onSave={updateMed} onClose={closeAll}/>
            </Modal>
          )}

          {mode==="qrResult" && qrGs1 && (
            <QRResultModal gs1={qrGs1} onConfirm={addMed} onClose={closeAll}/>
          )}
        </div>
      );
    }

    const S = {
      app:{minHeight:"100vh",backgroundColor:"#0f0f1a",color:"#e2e8f0",fontFamily:"'Nunito',sans-serif",paddingBottom:40},
      header:{background:"linear-gradient(135deg,#1e1b4b,#312e81)",padding:"20px 16px 0",position:"sticky",top:0,zIndex:10,boxShadow:"0 4px 20px rgba(0,0,0,.4)"},
      addBtn:{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"#fff",border:"none",borderRadius:12,padding:"10px 18px",fontWeight:700,cursor:"pointer",fontSize:15},
      search:{width:"100%",background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.15)",borderRadius:12,padding:"10px 14px",color:"#fff",fontSize:15,outline:"none",marginBottom:10},
      card:{background:"#1e1e2e",borderRadius:16,padding:"14px 14px 10px",boxShadow:"0 2px 12px rgba(0,0,0,.3)"},
      chip:{background:"rgba(255,255,255,.07)",borderRadius:8,padding:"3px 8px",fontSize:12,color:"#94a3b8"},
      googleBtn:{background:"rgba(59,130,246,.12)",border:"1px solid rgba(59,130,246,.3)",color:"#93c5fd",borderRadius:10,padding:"7px 14px",fontSize:13,cursor:"pointer",width:"100%"},
      iconBtn:{background:"none",border:"none",cursor:"pointer",fontSize:18,padding:4,borderRadius:8},
      badge:{
        expired:{background:"rgba(239,68,68,.2)",color:"#fca5a5",borderRadius:8,padding:"2px 8px",fontSize:11,fontWeight:700},
